name: Feature Request
description: Propose a focused improvement for a PeakURL project.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement! Please describe the use case and the change you would like to see.
  - type: input
    id: repository
    attributes:
      label: Repository
      description: Which PeakURL repository is this request for?
      placeholder: PeakURL/PeakURL
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: A clear description of the problem you are trying to solve or what is missing.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: A clear description of what you would like to happen or how the feature should work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, use cases, screenshots, or related discussions.
