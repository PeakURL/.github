name: Bug Report
description: Report a reproducible bug in a PeakURL project.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! A clear, reproducible report helps us investigate and fix problems quickly.
  - type: input
    id: repository
    attributes:
      label: Repository
      description: Which PeakURL repository is affected?
      placeholder: PeakURL/PeakURL
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. Observe error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relevant environment details (OS, PHP/Node.js version, browser, deployment context).
  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Logs, screenshots, or any extra context that could help.
